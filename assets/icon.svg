  </defs>

  <!-- 底：圆角方块 + 光晕 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="842" cy="150" r="270" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="150" cy="884" r="310" fill="#FFFFFF" opacity="0.05"/>

  <!-- 日历卡 -->
  <rect x="212" y="232" width="600" height="640" rx="72" fill="#FFFFFF"/>
  <path d="M212 304C212 264.235 244.235 232 284 232H740C779.765 232 812 264.235 812 304V388H212V304Z" fill="#E8F0FF"/>

  <!-- 装订环 -->
  <rect x="330" y="188" width="46" height="120" rx="23" fill="#FFFFFF"/>
  <rect x="648" y="188" width="46" height="120" rx="23" fill="#FFFFFF"/>

  <!-- 班次格 3x3 -->
  <rect x="302" y="440" width="112" height="112" rx="28" fill="#EAF1FF"/>
  <rect x="444" y="440" width="112" height="112" rx="28" fill="#EAF1FF"/>
