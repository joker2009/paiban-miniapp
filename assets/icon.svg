  <rect x="302" y="582" width="112" height="112" rx="28" fill="#EAF1FF"/>
  <!-- 高亮：这一格是“已确认的班次” -->
  <rect x="444" y="582" width="112" height="112" rx="28" fill="url(#shift)"/>
  <rect x="586" y="582" width="112" height="112" rx="28" fill="#EAF1FF"/>

  <rect x="302" y="724" width="112" height="112" rx="28" fill="#EAF1FF"/>
  <rect x="444" y="724" width="112" height="112" rx="28" fill="#EAF1FF"/>
  <rect x="586" y="724" width="112" height="112" rx="28" fill="#EAF1FF"/>

